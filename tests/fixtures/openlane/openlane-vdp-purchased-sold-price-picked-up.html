<!doctype html>
<html lang="en">
  <head>
    <title>OpenLane Purchased VDP</title>
  </head>
  <body>
    <aside class="sidebar-navigation">
      <nav>
        <h2>PURCHASE</h2>
        <a>Browse</a>
        <a>On hold</a>
        <a>Closing</a>
        <a>Purchases</a>
      </nav>
    </aside>

    <main data-testid="vehicle-detail-page" class="vdp-page">
      <section class="vehicle-hero" data-vin="KM8J3CA46HU123456">
        <h1>2017 Hyundai Tucson</h1>
        <p>VIN KM8J3CA46HU123456</p>
        <dl>
          <dt>Odometer</dt>
          <dd>111,486 KM</dd>
        </dl>
      </section>

      <section class="gallery" aria-label="Vehicle media">
        <p>23 total</p>
        <img src="https://pub-us.kar-media.com/vehicle/KM8J3CA46HU123456/front.jpg" alt="2017 Hyundai Tucson front" />
        <img src="https://pub-us.kar-media.com/vehicle/KM8J3CA46HU123456/rear.jpg" alt="2017 Hyundai Tucson rear" />
      </section>

      <section class="purchase-order-history">
        <h2>Purchases</h2>
        <h3>Order history</h3>
        <dl>
          <dt>Sold price</dt>
          <dd>$4,000</dd>
          <dt>Status</dt>
          <dd>Mark as picked up</dd>
        </dl>
        <button>Mark as picked up</button>
        <button>Full bid history</button>
      </section>

      <section class="transport-estimate">
        <h2>Transport estimate</h2>
        <p>CAD $378 / 211km</p>
      </section>

</html>
